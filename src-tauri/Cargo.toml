[package]
name = "kings-ai-native"
version = "1.0.0"
description = "K.I.N.G.S. AI native owner gateway"
authors = ["K.I.N.G.S. AI"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "kings_ai_native_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "kings-ai"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
