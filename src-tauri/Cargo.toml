[package]
name = "kings-ai-native"
version = "1.0.0"
description = "K.I.N.G.S. AI native owner gateway"
authors = ["K.I.N.G.S. AI"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "kings_ai_native_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "kings-ai"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
# Tauri 2.11.5 declares caret ranges for these crates. The 2.12 runtime
# changed monitor APIs incompatibly, so pin the coherent 2.11 family until the
# application intentionally upgrades the complete Tauri stack together.
tauri-runtime = { version = "=2.11.3", default-features = false }
tauri-runtime-wry = { version = "=2.11.4", default-features = false }
tauri-utils = { version = "=2.9.3", default-features = false, features = ["resources"] }
