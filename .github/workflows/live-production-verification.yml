name: KINGS Live Production Verification

on:
  push:
    branches:
      - kings-production-hardening-2026-09-02
      - kings-coding-machine-v1
  workflow_dispatch:
    inputs:
      provider_id:
        description: Optional provider id to force for the live coding acceptance
        required: false
        type: string
      model_id:
        description: Optional model id to force for the live coding acceptance
        required: false
        type: string

concurrency:
  group: kings-live-production-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  live-production:
    name: Live gateway, preflight, and coding acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      KINGS_OMNIROUTE_URL: ${{ secrets.KINGS_OMNIROUTE_URL }}
      KINGS_OMNIROUTE_KEY: ${{ secrets.KINGS_OMNIROUTE_KEY }}
      KINGS_9ROUTER_URL: ${{ secrets.KINGS_9ROUTER_URL }}
      KINGS_9ROUTER_KEY: ${{ secrets.KINGS_9ROUTER_KEY }}
      KINGS_AI_GATEWAYS_JSON: ${{ secrets.KINGS_AI_GATEWAYS_JSON }}
      KINGS_GITHUB_TOKEN: ${{ secrets.KINGS_GITHUB_TOKEN }}
      KINGS_LIVE_PROVIDER_ID: ${{ inputs.provider_id }}
      KINGS_LIVE_MODEL_ID: ${{ inputs.model_id }}
      KINGS_STATE_ROOT: ${{ runner.temp }}/kings-state
      KINGS_CODING_MACHINE_WORKSPACE: ${{ runner.temp }}/kings-state/projects
      KINGS_GATEWAY_USAGE_FILE: ${{ runner.temp }}/kings-state/gateway-usage.jsonl
      KINGS_BWRAP_PATH: /usr/bin/bwrap
      KINGS_ENABLE_OLLAMA_FALLBACK: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install host isolation
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          /usr/bin/bwrap --version

      - name: Install development dependencies
        run: npm install --no-audit --no-fund

      - name: Run deterministic verification first
        run: npm run check

      - name: Prove production host and gateway preflight
        run: npm run preflight:production

      - name: Execute real model-driven coding acceptance
        run: bash scripts/run-live-gateway-acceptance.sh
