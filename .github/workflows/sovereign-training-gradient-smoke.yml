name: K.I.N.G.S. Sovereign Training Gradient Smoke

on:
  pull_request:
    branches: [main, codex/powerhouse-training-android-20261030]
    paths:
      - "runtimes/powerhouse-training/**"
      - "development/sovereign-preference-gradient-smoke.py"
      - "development/sovereign-heldout-evaluation-test.py"
      - "development/sovereign-base-model-fingerprint-test.py"
      - ".github/workflows/sovereign-training-gradient-smoke.yml"
  push:
    branches: [main]
    paths:
      - "runtimes/powerhouse-training/**"
      - "development/sovereign-preference-gradient-smoke.py"
      - "development/sovereign-heldout-evaluation-test.py"
      - "development/sovereign-base-model-fingerprint-test.py"
      - ".github/workflows/sovereign-training-gradient-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kings-training-gradient-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-preference-gradients:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout training source
        uses: actions/checkout@v4

      - name: Set up owner-compatible Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify content-addressed local base model and reject unsafe snapshots
        run: |
          python development/sovereign-base-model-fingerprint-test.py

      - name: Install pinned PyTorch CPU for real gradient smoke
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Run real DPO adapter gradient and frozen-base assertions
        run: |
          python development/sovereign-preference-gradient-smoke.py

      - name: Verify real held-out scoring and seven-specialty evaluation isolation
        run: |
          python development/sovereign-heldout-evaluation-test.py

      - name: Verify supervised curriculum and long-form segment coverage
        run: |
          python development/sovereign-training-curriculum-test.py

# Deliberately no user data, model weights, training job or deployed-model claim.
# This proves gradients on a small synthetic local module, not seven-domain quality.
