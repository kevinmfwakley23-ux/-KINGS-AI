name: K.I.N.G.S. Sovereign Three-Stage End-to-End

on:
  pull_request:
    branches: [main, codex/powerhouse-training-android-20261030]
    paths:
      - "runtimes/powerhouse-training/sovereign_lora_trainer.py"
      - "runtimes/powerhouse-training/sovereign_base_model_fingerprint.py"
      - "runtimes/powerhouse-training/sovereign_preference_stage.py"
      - "runtimes/powerhouse-training/sovereign_heldout_stage.py"
      - "development/sovereign-end-to-end-training-smoke.py"
      - ".github/workflows/sovereign-training-end-to-end.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kings-training-full-stack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  locally-trained-test-weights:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout verified training source
        uses: actions/checkout@v4

      - name: Set up offline-capable Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned CPU PyTorch and local trainer dependencies
        run: |
          python -m pip install --disable-pip-version-check torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check \
            transformers==4.46.3 \
            peft==0.13.2 \
            accelerate==1.2.1 \
            tokenizers==0.20.3

      - name: Train and inspect a real LoRA adapter using three offline optimizer stages
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HF_DATASETS_OFFLINE: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python development/sovereign-end-to-end-training-smoke.py

      - name: Execute owner-authorized double-intensity 6/6/2 gradient training with full held-out coverage
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HF_DATASETS_OFFLINE: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python development/sovereign-end-to-end-training-smoke.py --training-profile double

      - name: Execute owner-authorized triple-intensity 9/9/3 offline gradient training with seven-domain evidence
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HF_DATASETS_OFFLINE: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python development/sovereign-end-to-end-training-smoke.py --training-profile triple

# Test-only randomly initialized tiny weights and synthetic data are generated
# in an ephemeral runner and destroyed; never publish the test model as a
# production AI, upload sensitive owner material, or claim specialist quality.
