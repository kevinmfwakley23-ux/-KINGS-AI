name: KINGS Production Verification

on:
  push:
    branches:
      - kings-coding-machine-v1
      - kings-production-hardening-2026-09-02
  pull_request:
    branches:
      - kings-coding-machine-v1

permissions:
  contents: read

concurrency:
  group: kings-production-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and focused workforce tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install development dependencies
        run: npm install --no-audit --no-fund

      - name: Build owner runtime and run focused workforce suite
        run: npm run check
