<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>K.I.N.G.S. Project Owner Console</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    body { margin:0; background:#0b1020; color:#edf2f7; }
    main { max-width:1100px; margin:0 auto; padding:32px 20px 60px; }
    h1 { margin:0 0 8px; }
    .muted { color:#9aa7bd; }
    .grid { display:grid; grid-template-columns:1.2fr .8fr; gap:20px; margin-top:20px; }
    .card { background:#131b2f; border:1px solid #26324d; border-radius:16px; padding:20px; }
    label { display:block; margin:14px 0 6px; font-weight:600; }
    input, textarea { width:100%; box-sizing:border-box; background:#0e1628; color:#fff; border:1px solid #33415f; border-radius:10px; padding:11px 12px; }
    textarea { min-height:120px; resize:vertical; }
    button { margin:8px 8px 0 0; padding:11px 16px; border:0; border-radius:10px; cursor:pointer; font-weight:700; }
    button:disabled { opacity:.45; cursor:not-allowed; }
    #submit { background:#f1c75b; color:#111827; }
    .danger { background:#ef6a6a; color:#fff; }
    .secondary { background:#2b3958; color:#fff; }
    .success { background:#4fae78; color:#fff; }
    .stack { display:grid; gap:12px; }
    .metric { padding:14px; background:#0e1628; border-radius:10px; }
    pre { white-space:pre-wrap; word-break:break-word; }
    .controls { margin-top:18px; }
    @media (max-width:800px){ .grid{grid-template-columns:1fr;} }
  </style>
</head>
<body>
  <main>
    <h1>K.I.N.G.S. Project Owner Console</h1>
    <div class="muted">Describe what you want built. K.I.N.G.S. turns the design into a governed engineering mission.</div>

    <div class="grid">
      <section class="card">
        <form id="mission-form">
          <label for="projectName">Project name</label>
          <input id="projectName" required placeholder="My new application">

          <label for="objective">What should it accomplish?</label>
          <textarea id="objective" required placeholder="Describe the outcome in your own words."></textarea>

          <label for="requirements">Requirements</label>
          <textarea id="requirements" required placeholder="One requirement per line"></textarea>

          <label for="platform">Preferred platform</label>
          <input id="platform" placeholder="Linux, web, Android, Chromebook...">

          <label for="language">Preferred language</label>
          <input id="language" placeholder="TypeScript, Python, Rust...">

          <label for="constraints">Constraints</label>
          <textarea id="constraints" placeholder="One constraint per line"></textarea>

          <label for="acceptance">How will we know it works?</label>
          <textarea id="acceptance" required placeholder="One acceptance criterion per line"></textarea>

          <button id="submit" type="submit">Create Engineering Mission</button>
        </form>

        <div class="controls">
          <button id="approve" class="secondary" disabled>Approve Plan</button>
          <button id="lock" class="secondary" disabled>Lock Plan</button>
          <button id="refresh" class="secondary" disabled>Refresh State</button>
          <button id="execute" class="success" disabled>Execute Next</button>
        </div>
      </section>

      <aside class="card">
        <h2>Mission Status</h2>
        <div class="stack">
          <div class="metric"><strong>Mission</strong><div id="mission">Not created</div></div>
          <div class="metric"><strong>Plan</strong><div id="plan">Waiting for mission</div></div>
          <div class="metric"><strong>Tasks</strong><div id="tasks">0 completed · 0 active · 0 failed</div></div>
          <div class="metric"><strong>System</strong><div id="system">Ready</div></div>
        </div>
        <pre id="details" class="muted"></pre>
      </aside>
    </div>
  </main>

  <script>
    const form = document.getElementById('mission-form');
    const system = document.getElementById('system');
    const approve = document.getElementById('approve');
    const lock = document.getElementById('lock');
    const refresh = document.getElementById('refresh');
    const execute = document.getElementById('execute');

    let missionId = null;
    let planApproved = false;
    let planLocked = false;

    const lines = value => value.split('\n').map(v => v.trim()).filter(Boolean);

    function render(payload) {
      const view = payload?.view;
      if (!view) return;

      missionId = view.mission?.id || missionId;
      planApproved = !!view.plan?.approvedByHuman;
      planLocked = !!view.plan?.locked;

      document.getElementById('mission').textContent = view.mission?.name || 'Unknown';
      document.getElementById('plan').textContent = view.plan?.objective || 'Plan unavailable';

      const state = view.state || {};
      document.getElementById('tasks').textContent =
        `${state.completedTaskIds?.length || 0} completed · ` +
        `${state.activeTaskIds?.length || 0} active · ` +
        `${state.failedTaskIds?.length || 0} failed`;

      document.getElementById('details').textContent = JSON.stringify(view, null, 2);

      approve.disabled = !missionId || planApproved;
      lock.disabled = !missionId || !planApproved || planLocked;
      refresh.disabled = !missionId;
      execute.disabled = !missionId || !planLocked;
    }

    async function call(action, extra = {}) {
      const response = await fetch('/api/project-owner/missions', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ action, missionId, ...extra }),
      });

      const payload = await response.json();
      if (!response.ok || !payload.ok) {
        throw new Error(payload.message || 'K.I.N.G.S. request failed.');
      }

      render(payload);
      system.textContent = payload.message || 'Complete';
      return payload;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      system.textContent = 'Creating engineering mission...';

      const input = {
        id: `ui-${Date.now()}`,
        projectName: document.getElementById('projectName').value.trim(),
        objective: document.getElementById('objective').value.trim(),
        requirements: lines(document.getElementById('requirements').value),
        preferredPlatform: document.getElementById('platform').value.trim() || undefined,
        preferredLanguage: document.getElementById('language').value.trim() || undefined,
        constraints: lines(document.getElementById('constraints').value),
        acceptanceCriteria: lines(document.getElementById('acceptance').value),
      };

      try {
        const response = await fetch('/api/project-owner/missions', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ action: 'create-mission', input }),
        });

        const payload = await response.json();
        if (!response.ok || !payload.ok) {
          throw new Error(payload.message || 'Mission creation failed.');
        }

        render(payload);
        system.textContent = payload.message || 'Mission created';
      } catch (error) {
        system.textContent = error instanceof Error ? error.message : String(error);
      }
    });

    approve.addEventListener('click', async () => {
      try { await call('approve-plan'); }
      catch (error) { system.textContent = error instanceof Error ? error.message : String(error); }
    });

    lock.addEventListener('click', async () => {
      try { await call('lock-plan'); }
      catch (error) { system.textContent = error instanceof Error ? error.message : String(error); }
    });

    refresh.addEventListener('click', async () => {
      try { await call('snapshot'); }
      catch (error) { system.textContent = error instanceof Error ? error.message : String(error); }
    });

    execute.addEventListener('click', async () => {
      system.textContent = 'Execution requires the configured machine runtime context.';
      execute.disabled = true;
    });
  </script>
</body>
</html>
